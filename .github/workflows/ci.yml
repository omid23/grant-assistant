name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t grant-assistant .
      - name: Start the image and run the smoke test against it
        run: |
          docker run -d --name ga -p 3000:3000 -e TODAY=2026-11-05 grant-assistant
          for i in $(seq 1 20); do curl -fsS localhost:3000/health && break; sleep 1; done
          BASE_URL=http://localhost:3000 node scripts/smoke.mjs
      - if: always()
        run: docker logs ga || true
